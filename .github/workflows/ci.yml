name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Dart — dart test, analyze
    runs-on: ubuntu-latest
    steps:
      # identity is a git dependency (identity: {git: {url: ..., ref: main}}
      # in pubspec.yaml), so `dart pub get` fetches it directly — no
      # sibling checkout needed.
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsodium23
          version: 1.0
      - run: dart pub get
      - run: dart analyze
      - run: dart test

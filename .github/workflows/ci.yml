name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Dart — flutter test + analyze
    runs-on: ubuntu-latest
    steps:
      # identity is a git dependency (identity: {git: {url: ..., ref: main}}
      # in pubspec.yaml), so `flutter pub get` fetches it directly — no
      # sibling checkout needed.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

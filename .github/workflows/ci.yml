name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Dart — flutter test + analyze
    runs-on: ubuntu-latest
    steps:
      # groups depends on identity via a sibling path dependency
      # (identity: {path: ../identity} in pubspec.yaml), so check both
      # repos out side by side in the workspace.
      - uses: actions/checkout@v4
        with:
          path: groups
      - uses: actions/checkout@v4
        with:
          repository: needyaz/identity
          path: identity
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: groups
      - run: flutter analyze
        working-directory: groups
      - run: flutter test
        working-directory: groups

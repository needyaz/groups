name: groups
description: "End-to-end-encrypted group membership, key rotation, manifests, and a signed ownership charter."
version: 0.5.0
publish_to: 'none'

environment:
  sdk: ^3.11.3

dependencies:
  # Foundation: identity, key derivation, and the generic crypto primitives.
  identity:
    git:
      url: https://github.com/needyaz/identity.git
      ref: main

  sodium: ^4.0.0           # libsodium types + group-key generation
  crypto: ^3.0.3           # SHA-256 for charter hashing

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
